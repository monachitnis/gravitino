version: "3.8"

# Gravitino HA Correctness — Smoke Test Environment
# Companion to: docs/superpowers/specs/2026-05-17-gravitino-ha-test-harness.md
#
# Two Gravitino nodes sharing one PostgreSQL entity store and all catalog backends.
# Follows the network and naming conventions of:
#   integration-test-common/docker-script/docker-compose.yaml

networks:
  gravitino-ci-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.31.0/28

services:

  # ── Entity Store (shared by both Gravitino nodes) ─────────────────────────
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: gravitino
      POSTGRES_USER: gravitino
      POSTGRES_PASSWORD: gravitino
    ports:
      - "5432:5432"
    networks:
      gravitino-ci-network:
        ipv4_address: 10.20.31.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gravitino"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── etcd (leader election for active-standby HA) ──────────────────────────
  # Single-node for test simplicity (production uses 3-node quorum)
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-token=gravitino-test
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    networks:
      gravitino-ci-network:
        ipv4_address: 10.20.31.3
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Gravitino Node A ──────────────────────────────────────────────────────
  gravitino-node-a:
    image: apache/gravitino:latest
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      GRAVITINO_SERVER_WEBSERVER_PORT: 8090
      GRAVITINO_NODE_ID: node-a
      GRAVITINO_ENTITY_STORE: relational
      GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_URL: jdbc:postgresql://postgres:5432/gravitino
      GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_DRIVER: org.postgresql.Driver
      GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_USER: gravitino
      GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_PASSWORD: gravitino
      GRAVITINO_CACHE_ENTITY_CHANGE_LOG_ENABLED: "true"
      GRAVITINO_CACHE_ENTITY_CHANGE_LOG_POLL_INTERVAL_MS: "500"
      GRAVITINO_HA_ETCD_ENDPOINTS: http://etcd:2379
      GRAVITINO_HA_LEASE_TTL_SECONDS: "15"
    ports:
      - "8090:8090"
    networks:
      gravitino-ci-network:
        ipv4_address: 10.20.31.4
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/api/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Gravitino Node B ──────────────────────────────────────────────────────
  gravitino-node-b:
    image: apache/gravitino:latest
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      GRAVITINO_SERVER_WEBSERVER_PORT: 8091
      GRAVITINO_NODE_ID: node-b
      GRAVITINO_ENTITY_STORE: relational
      GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_URL: jdbc:postgresql://postgres:5432/gravitino
      GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_DRIVER: org.postgresql.Driver
      GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_USER: gravitino
      GRAVITINO_ENTITY_STORE_RELATIONAL_JDBC_PASSWORD: gravitino
      GRAVITINO_CACHE_ENTITY_CHANGE_LOG_ENABLED: "true"
      GRAVITINO_CACHE_ENTITY_CHANGE_LOG_POLL_INTERVAL_MS: "500"
      GRAVITINO_HA_ETCD_ENDPOINTS: http://etcd:2379
      GRAVITINO_HA_LEASE_TTL_SECONDS: "15"
    ports:
      - "8091:8091"
    networks:
      gravitino-ci-network:
        ipv4_address: 10.20.31.5
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/api/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Hive Catalog Backend ──────────────────────────────────────────────────
  hive-metastore:
    image: ${GRAVITINO_CI_HIVE_DOCKER_IMAGE:-apache/gravitino-ci-hive:latest}
    environment:
      HIVE_RUNTIME_VERSION: hive3
    ports:
      - "9083:9083"   # Hive Metastore Thrift
      - "9000:9000"   # HDFS NameNode
      - "10000:10000" # HiveServer2
    networks:
      gravitino-ci-network:
        ipv4_address: 10.20.31.6
    healthcheck:
      test: ["CMD-SHELL", "hive --service metastore --version 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ── Iceberg REST Catalog Backend ──────────────────────────────────────────
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_S3_ENDPOINT: http://minio:9100
    ports:
      - "8181:8181"
    depends_on:
      - minio
    networks:
      gravitino-ci-network:
        ipv4_address: 10.20.31.7

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9100"
      - "9101:9101"
    networks:
      gravitino-ci-network:
        ipv4_address: 10.20.31.8

  # ── Kafka Backend ─────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    ports:
      - "9092:9092"
    networks:
      gravitino-ci-network:
        ipv4_address: 10.20.31.9
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
